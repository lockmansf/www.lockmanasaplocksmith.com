name: Publish and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # every hour: publish.py decides if it's today's hour
    - cron: "41 10 * * 1"  # Mondays: re-check published articles for copies online
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [publish, publish-now, check-keys]
        default: publish

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the Gemini and Copyscape keys
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'check-keys'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COPYSCAPE_USER: ${{ secrets.COPYSCAPE_USER }}
          COPYSCAPE_KEY: ${{ secrets.COPYSCAPE_KEY }}
        run: python3 -m publisher.check

      - name: Publish today's article (if it's time)
        if: (github.event_name == 'workflow_dispatch' && inputs.task != 'check-keys') || github.event.schedule == '17 * * * *'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COPYSCAPE_USER: ${{ secrets.COPYSCAPE_USER }}
          COPYSCAPE_KEY: ${{ secrets.COPYSCAPE_KEY }}
        run: python3 -m publisher.publish ${{ inputs.task == 'publish-now' && '--now' || '' }}

      - name: Weekly originality re-check
        if: github.event.schedule == '41 10 * * 1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COPYSCAPE_USER: ${{ secrets.COPYSCAPE_USER }}
          COPYSCAPE_KEY: ${{ secrets.COPYSCAPE_KEY }}
        run: python3 -m publisher.recheck

      - name: Save changes
        id: save
        run: |
          git config user.name "lockman-bot"
          git config user.email "lockman-bot@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Articles: automatic update"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        run: python3 build.py

      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        with:
          path: dist
      - id: deploy
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
